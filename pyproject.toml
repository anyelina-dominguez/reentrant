[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reentrant"
version = "0.4.0"
description = "Running an orienteering event: courses, entries, punches and results"
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }

[project.scripts]
reentrant = "reentrant.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
